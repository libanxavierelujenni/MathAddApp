<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Dash</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app-container">
        <!-- Main Menu -->
        <div id="screen-menu" class="screen active">
            <h1 class="logo">Math<span class="highlight">Dash</span></h1>
            <p class="subtitle">Think fast. 3 seconds per question!</p>
            <div class="score-display">High Score: <span id="high-score-display">0</span></div>
            <button id="btn-start" class="btn primary">Start Game</button>
        </div>

        <!-- Game Screen -->
        <div id="screen-game" class="screen">
            <div class="header">
                <div class="score">Score: <span id="current-score">0</span></div>
            </div>
            <div class="timer-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>
            <div class="problem-container">
                <div id="problem" class="problem">? + ?</div>
            </div>
            <div class="options-container" id="options">
                <button class="btn option" data-index="0">A</button>
                <button class="btn option" data-index="1">B</button>
                <button class="btn option" data-index="2">C</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="screen-game-over" class="screen">
            <h1 class="game-over-title">Game Over!</h1>
            <div class="final-score">Score: <span id="final-score-display">0</span></div>
            <button id="btn-restart" class="btn primary">Play Again</button>
            <button id="btn-menu" class="btn secondary">Main Menu</button>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((registration) => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, (err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
</body>
</html>
